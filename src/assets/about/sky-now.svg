<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" fill="none" role="img">
  <title>A sun rising from behind a soft cloud</title>
  <style>
    @keyframes tdy-rise { 0%, 100% { transform: translateY(7px) } 50% { transform: translateY(-9px) } }
    @keyframes tdy-drift { 0%, 100% { transform: translateX(-7px) } 50% { transform: translateX(7px) } }
    @keyframes tdy-breathe { 0%, 100% { opacity: .55; transform: scale(.96) } 50% { opacity: .9; transform: scale(1.04) } }
    @keyframes tdy-halo { 0%, 100% { opacity: .55; transform: scale(1) } 50% { opacity: .8; transform: scale(1.06) } }
    .tdy-rise, .tdy-drift, .tdy-breathe, .tdy-halo { transform-box: fill-box; transform-origin: center }
    .tdy-rise { animation: tdy-rise 9s ease-in-out infinite }
    .tdy-drift { animation: tdy-drift 13s ease-in-out infinite }
    .tdy-breathe { animation: tdy-breathe 7s ease-in-out infinite }
    .tdy-halo { animation: tdy-halo 11s ease-in-out infinite }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>
  <defs>
    <linearGradient id="now-sun" x1="234" y1="62" x2="324" y2="184" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE798" />
      <stop offset=".5" stop-color="#FFC65F" />
      <stop offset="1" stop-color="#FCA45F" />
    </linearGradient>
    <radialGradient id="now-sunHalo" cx="0" cy="0" r="1"
      gradientTransform="translate(280 124) scale(148)" gradientUnits="userSpaceOnUse">
      <stop offset=".38" stop-color="#FFCB63" stop-opacity=".5" />
      <stop offset="1" stop-color="#FFCB63" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="now-cloud" x1="80" y1="130" x2="310" y2="316" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset=".5" stop-color="#F5FAFD" />
      <stop offset="1" stop-color="#CFE3F2" />
    </linearGradient>
    <radialGradient id="now-bloom" cx="0" cy="0" r="1"
      gradientTransform="translate(272 202) scale(112 92)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB495" stop-opacity=".7" />
      <stop offset=".6" stop-color="#FFCDB4" stop-opacity=".28" />
      <stop offset="1" stop-color="#FFCDB4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="now-ambient" cx="0" cy="0" r="1"
      gradientTransform="translate(200 214) scale(214 178)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#CBE3F6" stop-opacity=".8" />
      <stop offset="1" stop-color="#CBE3F6" stop-opacity="0" />
    </radialGradient>

    <filter id="now-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22" />
    </filter>
    <filter id="now-grain">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer><feFuncA type="linear" slope=".16" /></feComponentTransfer>
    </filter>

    <g id="now-cloudShape">
      <circle cx="196" cy="214" r="88" />
      <circle cx="114" cy="252" r="60" />
      <circle cx="272" cy="246" r="68" />
      <rect x="58" y="244" width="280" height="72" rx="36" />
    </g>
    <!-- a mask, not a clipPath: clipPath children may not be groups -->
    <mask id="now-cloudMask" maskUnits="userSpaceOnUse" x="0" y="0" width="420" height="380">
      <use href="#now-cloudShape" fill="#FFFFFF" />
    </mask>
  </defs>

  <!-- ambient sky glow, spills past the frame so the card edge never cuts it hard -->
  <ellipse class="tdy-halo" cx="200" cy="214" rx="214" ry="178" fill="url(#now-ambient)" />

  <!-- sun, drawn behind the cloud -->
  <g class="tdy-rise">
    <circle cx="280" cy="124" r="148" fill="url(#now-sunHalo)" />
    <circle cx="280" cy="124" r="66" fill="url(#now-sun)" />
  </g>

  <!-- cast shadow -->
  <ellipse cx="192" cy="308" rx="152" ry="34" fill="#8FB4CF" opacity=".3" filter="url(#now-soft)" />

  <g class="tdy-drift">
    <use href="#now-cloudShape" fill="url(#now-cloud)" />
    <g mask="url(#now-cloudMask)">
      <!-- warm bloom where the sun sits behind the cloud -->
      <ellipse class="tdy-breathe" cx="272" cy="202" rx="112" ry="92" fill="url(#now-bloom)" />
      <rect x="0" y="0" width="420" height="380" filter="url(#now-grain)" opacity=".5" />
    </g>
  </g>
</svg>
